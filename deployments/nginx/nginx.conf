# Nginx Configuration for Sentiment Analysis API
# Features: Load Balancing, HTTPS, Authentication, Rate Limiting, A/B Testing

# Define upstream servers for API v1 (3 replicas for load balancing)
upstream api_v1_backend {
    least_conn;  # Use least connections load balancing algorithm
    server api-v1-1:8000 max_fails=3 fail_timeout=30s;
    server api-v1-2:8000 max_fails=3 fail_timeout=30s;
    server api-v1-3:8000 max_fails=3 fail_timeout=30s;
}

# Define upstream server for API v2 (debug version)
upstream api_v2_backend {
    server api-v2:8000 max_fails=3 fail_timeout=30s;
}

# Rate limiting zone: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# HTTP Server - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server - Main API Gateway
server {
    listen 443 ssl http2;
    server_name localhost;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Access and Error Logs
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Client settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Root endpoint - API Gateway Info
    location = / {
        add_header Content-Type application/json;
        return 200 '{"message": "Sentiment Analysis API Gateway", "version": "1.0.0", "endpoints": {"/predict": "POST - Protected sentiment prediction", "/health": "GET - Health check", "/metrics": "GET - Nginx metrics"}}';
    }

    # Health check endpoint - No authentication required
    location /health {
        # A/B Testing: Route to v2 if X-Experiment-Group header is "debug"
        if ($http_x_experiment_group = "debug") {
            proxy_pass http://api_v2_backend;
            break;
        }
        
        # Default: Route to v1
        proxy_pass http://api_v1_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Predict endpoint - Protected with authentication and rate limiting
    location /predict {
        # Basic Authentication
        auth_basic "Sentiment Analysis API";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Rate Limiting: 10 requests per second, allow burst of 20
        limit_req zone=predict_limit burst=20 nodelay;
        limit_conn addr 10;

        # A/B Testing: Route to v2 if X-Experiment-Group header is "debug"
        set $backend "api_v1_backend";
        if ($http_x_experiment_group = "debug") {
            set $backend "api_v2_backend";
        }

        # Proxy to appropriate backend
        proxy_pass http://$backend;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Experiment-Group $http_x_experiment_group;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Metrics endpoint for Prometheus (from API services)
    location /api/metrics {
        # A/B Testing: Route to v2 if X-Experiment-Group header is "debug"
        if ($http_x_experiment_group = "debug") {
            proxy_pass http://api_v2_backend/metrics;
            break;
        }
        
        # Default: Route to v1
        proxy_pass http://api_v1_backend/metrics;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Nginx stub_status for monitoring
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.0.0.0/8;  # Allow from Docker network
        allow 127.0.0.1;     # Allow from localhost
        deny all;            # Deny all others
    }

    # Custom error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Content-Type application/json;
        return 404 '{"error": "Not Found", "message": "The requested endpoint does not exist"}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        add_header Content-Type application/json;
        return 500 '{"error": "Internal Server Error", "message": "An error occurred processing your request"}';
    }

    # Rate limit error page
    error_page 429 /429.html;
    location = /429.html {
        internal;
        add_header Content-Type application/json;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please try again later."}';
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
